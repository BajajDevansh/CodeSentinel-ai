server:
  port: 8080

spring:
  application:
    name: codesentinel-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://devanshbajaj0206:Akshat%40123@cluster0-shard-00-00.7ene5.mongodb.net:27017,cluster0-shard-00-01.7ene5.mongodb.net:27017,cluster0-shard-00-02.7ene5.mongodb.net:27017/codesentinel?ssl=true&replicaSet=atlas-z49ios-shard-0&authSource=admin}
